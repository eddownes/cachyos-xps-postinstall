# Blacklist ov08x40. It must load after intel_cvs acquires camera ownership.
blacklist ov08x40

# If ov08x40 is loaded manually, ensure intel_cvs loads first.
softdep ov08x40 pre: intel_cvs

# Blacklist intel_ipu7. Without this it auto-loads via ordinary PCI hotplug
# well before camera-init.service's modprobe sequence runs ov08x40, so its
# one-shot ACPI sensor scan/notifier completes with zero sensors matched and
# never retries ("intel-ipu7 0000:00:05.0: no subdev found in graph"). It must
# load after ov08x40 registers its async v4l2 subdev; camera-init.service
# modprobes it explicitly once ov08x40 is up.
blacklist intel_ipu7
